name: PR 159178 warm-state publication-fence GREEN proposal capture
run-name: pr159178 warm-state publication-fence GREEN proposal capture ${{ inputs.controller_sha }}
on:
  workflow_dispatch:
    inputs:
      controller_sha:
        description: Full reviewed controller commit (must equal dispatched workflow SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pr159178-warm-state-red
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'roboclaw-bot/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CONTROLLER_SHA: ${{ inputs.controller_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      GIT_NO_LAZY_FETCH: "1"
      BASE_SHA: fd0b54a58f93b68a49eb07695705cd770ebb91b1
      PRODUCT_BASE_SHA: a95aa9917bedf89d80d41f089b508a3a1658c4ae
      CANDIDATE_TREE: b1c1331382cae5f993b46cc0e1495e9ba60d690d
      FIXED_PRODUCTION_TREE: 7acd228cb5655502997c49011342a1c32f2b49ea
      REPRO_TREE: 671972f8926b4e954e39c37a56189949d21165a5
      CAPTURE_SHA256: 55fa5eb96b48078a4089c9c30309937115713f687c3c4796da19bf951e8e3fca
    steps:
      - name: Record run identity and guard execution
        id: guard
        env:
          HOST_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr159178-publication-fence-green"
          mkdir -p "$evidence"
          jq -n --arg controller "$CONTROLLER_SHA" --arg workflow "$WORKFLOW_SHA" \
            --arg host "$HOST_ENVIRONMENT" --arg os "$RUNNER_OS" --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg base "$BASE_SHA" \
            --arg candidate "$CANDIDATE_TREE" --arg fixed "$FIXED_PRODUCTION_TREE" --arg repro "$REPRO_TREE" --arg product "$PRODUCT_BASE_SHA" \
            '{repository:$repository,runId:$run,attempt:$attempt,controllerSha:$controller,
              workflowSha:$workflow,runtimeHead:$base,productionBaseSha:$product,candidateTree:$candidate,fixedProductionDocsTree:$fixed,reproductionTree:$repro,hostEnvironment:$host,runnerOS:$os,
              classification:"UNCLASSIFIED publication-fence GREEN proposal; fd0 HEAD with fixed A95 production/docs bytes plus unchanged RED fixture, not an actual repaired production commit or green validation"}' \
            > "$evidence/identity.json"
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROLLER_SHA" = "$GITHUB_SHA"
          test "$CONTROLLER_SHA" = "$WORKFLOW_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = roboclaw-bot/openclaw
          test "$GITHUB_REF" = refs/heads/main
          test "$HOST_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}"
      - name: Check out immutable reviewed controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.controller_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preserve hashed inputs and verify controller-only delta
        id: preserve
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr159178-publication-fence-green"
          test "$(git rev-parse HEAD)" = "$CONTROLLER_SHA"
          test "$(git rev-parse HEAD^)" = 057f22a18142b6368f105570b175cd1213e99a5d
          git diff --quiet HEAD
          git diff --name-status HEAD^ HEAD > "$evidence/controller-delta.txt"
          printf 'M\t%s\nA\t%s\nM\t%s\n' \
            .github/proof-inputs/pr159178-warm-admission-red/capture.sh \
            .github/proof-inputs/pr159178-warm-admission-red/production-docs.patch.b64 \
            .github/workflows/pr159178-warm-admission-red.yml > "$evidence/expected-controller-delta.txt"
          cmp "$evidence/expected-controller-delta.txt" "$evidence/controller-delta.txt"
          input=.github/proof-inputs/pr159178-warm-admission-red
          cp "$input/capture.sh" "$evidence/capture.sh"
          cp .github/workflows/pr159178-warm-admission-red.yml "$evidence/workflow.yml"
          base64 --decode "$input/a95-production.patch.b64" > "$evidence/a95-production.patch"
          base64 --decode "$input/production-docs.patch.b64" > "$evidence/production-docs.patch"
          base64 --decode "$input/publication-fence-tests.patch.b64" > "$evidence/publication-fence-tests.patch"
          cd "$evidence"
          printf '%s  %s\n' \
            ab6489032d4c91fa7a897ba4a159779b39bb9cf1b4170b7976ab19265ea07dab a95-production.patch \
            159e901ffea24da636e365e89d2d915f4f1091eac30128b8855c214ae8c217f0 production-docs.patch \
            784c75bdc0d3500794df1608376ac7df4ba42ffad29e8da087a7296117878b52 publication-fence-tests.patch \
            "$CAPTURE_SHA256" capture.sh > inputs.sha256
          sha256sum --check inputs.sha256
      - name: Check out public fd0 without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: fd0b54a58f93b68a49eb07695705cd770ebb91b1
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize fixed A95 production and docs with unchanged RED fixture
        id: materialize
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr159178-publication-fence-green"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --quiet HEAD
          git apply --index --check "$evidence/a95-production.patch"
          git apply --index "$evidence/a95-production.patch"
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          git diff --quiet
          git diff --cached --check
          git apply --index --check "$evidence/production-docs.patch"
          git apply --index "$evidence/production-docs.patch"
          test "$(git write-tree)" = "$FIXED_PRODUCTION_TREE"
          capture_file=extensions/crabbox/src/crabbox-worker-warm-image-capture.ts
          docs_file=docs/gateway/cloud-workers/warm-images.md
          printf '%s\n' "$docs_file" "$capture_file" > "$evidence/expected-production-docs-paths.txt"
          git diff --cached --name-only "$CANDIDATE_TREE" > "$evidence/production-docs-paths.txt"
          cmp "$evidence/expected-production-docs-paths.txt" "$evidence/production-docs-paths.txt"
          git diff --quiet "$CANDIDATE_TREE" "$FIXED_PRODUCTION_TREE" -- . ":(exclude)$capture_file" ":(exclude)$docs_file"
          test "$(sha256sum "$capture_file" | cut -d ' ' -f1)" = 1c9fcbfb79922b0d690c7c0b77856b312db05f9a12c35eb43f73392427f9776f
          git diff --quiet
          git diff --cached --check
          git diff --cached --raw "$CANDIDATE_TREE" > "$evidence/production-docs-delta.raw"
          git diff --cached --numstat "$CANDIDATE_TREE" > "$evidence/production-docs-delta.numstat"
          git apply --index --check "$evidence/publication-fence-tests.patch"
          git apply --index "$evidence/publication-fence-tests.patch"
          test "$(git write-tree)" = "$REPRO_TREE"
          test_file=extensions/crabbox/src/crabbox-worker-warm-image-authority.test.ts
          sibling_file=extensions/crabbox/src/crabbox-worker-warm-image-sibling-admission.test.ts
          test "$(git diff --cached --name-only "$FIXED_PRODUCTION_TREE")" = "$test_file"
          test "$(sha256sum "$test_file" | cut -d ' ' -f1)" = 70ef3d0941c581a3002944433ee13150f257bcd82971b4feb0f62c670edf6bd8
          # Tree comparison binds ALL non-test bytes and modes, not only the capture owner.
          git diff --quiet "$FIXED_PRODUCTION_TREE" "$REPRO_TREE" -- . ":(exclude)$test_file"
          git diff --quiet
          git diff --cached --check
          git ls-tree -r "$CANDIDATE_TREE" > "$evidence/a95-tree-manifest.txt"
          git ls-tree -r "$FIXED_PRODUCTION_TREE" > "$evidence/fixed-production-docs-tree-manifest.txt"
          git ls-tree -r "$REPRO_TREE" > "$evidence/reproduction-tree-manifest.txt"
          git diff --cached --raw "$FIXED_PRODUCTION_TREE" > "$evidence/test-only-delta.raw"
          git diff --cached --numstat "$FIXED_PRODUCTION_TREE" > "$evidence/test-only-delta.numstat"
          printf '%s\n' "$(git rev-parse HEAD)" > "$evidence/runtime-head.txt"
          printf '%s\n' "$(git write-tree)" > "$evidence/materialized-tree.txt"
          cp "$test_file" "$sibling_file" "$docs_file" \
            extensions/crabbox/src/crabbox-worker-warm-image-admission.test-support.ts \
            extensions/crabbox/src/crabbox-worker-warm-image-sibling-admission.test-support.ts \
            extensions/crabbox/src/crabbox-worker-warm-image-capture.ts \
            extensions/crabbox/src/crabbox-worker-warm-image-records.ts \
            extensions/crabbox/src/crabbox-worker-warm-image-checkpoint.ts \
            test/helpers/sqlite-worker-admission.ts \
            test/vitest/vitest.extension-database-workers-paths.mjs "$evidence/"
      - name: Install declared dependencies with canonical setup action
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "true"
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: "off"
      # No commit: this reproduces reviewed staged bytes on the real public fd0 HEAD.
      # This does not waive the later actual production commit with normal hooks.
      - name: Capture both full native authority and sibling files without filters
        id: custody
        run: |
          set -euo pipefail
          recipe="$RUNNER_TEMP/pr159178-publication-fence-green/capture.sh"
          test "$(sha256sum "$recipe" | cut -d ' ' -f1)" = "$CAPTURE_SHA256"
          bash "$recipe"
      - name: Capture canonical plugin test types after settled native runtime
        id: types
        if: ${{ always() && !cancelled() && steps.setup.outcome == 'success' && steps.materialize.outcome == 'success' && steps.custody.outputs.settled == 'true' }}
        run: |
          set -euo pipefail
          recipe="$RUNNER_TEMP/pr159178-publication-fence-green/capture.sh"
          test "$(sha256sum "$recipe" | cut -d ' ' -f1)" = "$CAPTURE_SHA256"
          bash "$recipe" types
      - name: Check formatting of exactly three changed files without writes
        id: format
        if: ${{ always() && !cancelled() && steps.setup.outcome == 'success' && steps.materialize.outcome == 'success' && steps.custody.outputs.settled == 'true' }}
        run: |
          set -euo pipefail
          recipe="$RUNNER_TEMP/pr159178-publication-fence-green/capture.sh"
          test "$(sha256sum "$recipe" | cut -d ' ' -f1)" = "$CAPTURE_SHA256"
          bash "$recipe" format
      - name: List source docs without mutation after settled native runtime
        id: docs
        if: ${{ always() && !cancelled() && steps.setup.outcome == 'success' && steps.materialize.outcome == 'success' && steps.custody.outputs.settled == 'true' }}
        run: |
          set -euo pipefail
          recipe="$RUNNER_TEMP/pr159178-publication-fence-green/capture.sh"
          test "$(sha256sum "$recipe" | cut -d ' ' -f1)" = "$CAPTURE_SHA256"
          bash "$recipe" docs
      - name: Record native workflow step outcomes
        if: ${{ always() }}
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr159178-publication-fence-green"
          mkdir -p "$evidence"
          printf '%s\n' "$STEP_OUTCOMES" > "$evidence/step-outcomes.json"
          printf '%s\n' 'Unclassified GREEN proposal capture. Predicted 44 passing cases is not observed GREEN. Inspect full native logs, warnings, current return values, timing, all phase statuses and source integrity. Native labels may be ellipsized; expanded fixture labels are not literal log output. Format/docs/type failures retain runtime evidence but block total-green claims. CLI doubles are not cloud proof.' >> "$GITHUB_STEP_SUMMARY"
      - name: Always upload publication-fence evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr159178-publication-fence-green-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/pr159178-publication-fence-green/
