name: PR 159178 warm-state capture-recovery RED capture
run-name: pr159178 warm-state capture-recovery RED capture ${{ inputs.controller_sha }}
on:
  workflow_dispatch:
    inputs:
      controller_sha:
        description: Full reviewed controller commit (must equal dispatched workflow SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pr159178-warm-state-red
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'roboclaw-bot/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CONTROLLER_SHA: ${{ inputs.controller_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      BASE_SHA: 0edae198d278686e16426f7ad254d0341bd6e3d3
      CANDIDATE_TREE: f5d2357d3b627de4ddc7d249e630acd8620f127b
      RED_TREE: 9700a99108547ead6e56c131cbde10cb2cc54914
      CAPTURE_SHA256: 1b4373509d5249e8af57fdb4b9ac3f5791dad42afba238193308e3c4c7078c4d
    steps:
      - name: Record run identity and guard execution
        id: guard
        env:
          HOST_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr159178-warm-capture-recovery-red"
          mkdir -p "$evidence"
          jq -n --arg controller "$CONTROLLER_SHA" --arg workflow "$WORKFLOW_SHA" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg base "$BASE_SHA" \
            --arg candidate "$CANDIDATE_TREE" --arg red "$RED_TREE" \
            '{repository:$repository,runId:$run,attempt:$attempt,controllerSha:$controller,
              workflowSha:$workflow,baseSha:$base,candidateTree:$candidate,redTree:$red,
              classification:"UNCLASSIFIED capture-recovery; exact f5 production plus test-only recovery oracle, not rebase or green validation"}' \
            > "$evidence/identity.json"
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROLLER_SHA" = "$GITHUB_SHA"
          test "$CONTROLLER_SHA" = "$WORKFLOW_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = roboclaw-bot/openclaw
          test "$GITHUB_REF" = refs/heads/main
          test "$HOST_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}"
      - name: Check out immutable reviewed controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.controller_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Preserve hashed inputs and verify controller-only delta
        id: preserve
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr159178-warm-capture-recovery-red"
          test "$(git rev-parse HEAD)" = "$CONTROLLER_SHA"
          test "$(git rev-parse HEAD^)" = 787fdcee31a4bf783f12817025dcc3baaf245e17
          git diff --quiet HEAD
          git diff --name-status HEAD^ HEAD > "$evidence/controller-delta.txt"
          printf 'M\t%s\nA\t%s\nA\t%s\nM\t%s\n' \
            .github/proof-inputs/pr159178-warm-admission-red/capture.sh \
            .github/proof-inputs/pr159178-warm-admission-red/f5-candidate.patch.b64 \
            .github/proof-inputs/pr159178-warm-admission-red/recovery-tests.patch.b64 \
            .github/workflows/pr159178-warm-admission-red.yml > "$evidence/expected-controller-delta.txt"
          cmp "$evidence/expected-controller-delta.txt" "$evidence/controller-delta.txt"
          input=.github/proof-inputs/pr159178-warm-admission-red
          cp "$input/capture.sh" "$evidence/capture.sh"
          cp .github/workflows/pr159178-warm-admission-red.yml "$evidence/workflow.yml"
          base64 --decode "$input/f5-candidate.patch.b64" > "$evidence/f5-candidate.patch"
          base64 --decode "$input/recovery-tests.patch.b64" > "$evidence/recovery-tests.patch"
          cd "$evidence"
          printf '%s  %s\n' \
            5fc116ddfffefc7f7df1b7eea38cd88f84cf6c79264484fc2f832633a6887481 f5-candidate.patch \
            edc08645653d065287bc6fc1a5d8140c291565b5330f6cf147656b50d05a1cf1 recovery-tests.patch \
            "$CAPTURE_SHA256" capture.sh > inputs.sha256
          sha256sum --check inputs.sha256
      - name: Check out frozen main without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 0edae198d278686e16426f7ad254d0341bd6e3d3
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize exact f5 plus recovery tests without production repair
        id: materialize
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr159178-warm-capture-recovery-red"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --quiet HEAD
          git apply --index --check "$evidence/f5-candidate.patch"
          git apply --index "$evidence/f5-candidate.patch"
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          git diff --quiet
          git diff --cached --check
          git apply --index --check "$evidence/recovery-tests.patch"
          git apply --index "$evidence/recovery-tests.patch"
          test "$(git write-tree)" = "$RED_TREE"
          test_file=extensions/crabbox/src/crabbox-worker-warm-image-sibling-admission.test.ts
          support_file=extensions/crabbox/src/crabbox-worker-warm-image-sibling-admission.test-support.ts
          fixture_file=extensions/crabbox/src/crabbox-worker-warm-image-store.test.ts
          routing_file=test/vitest/vitest.extension-database-workers-paths.mjs
          owner_file=extensions/crabbox/src/crabbox-worker-warm-image-capture.ts
          test "$(git diff --cached --name-only "$CANDIDATE_TREE")" = "$(printf '%s\n%s' "$support_file" "$test_file")"
          test "$(sha256sum "$test_file" | cut -d ' ' -f1)" = aae513314c2fbc711a07748bd08dbcef255edc350a5639b5180caba14de182b4
          test "$(sha256sum "$support_file" | cut -d ' ' -f1)" = a73d5f9b531762a5a9c1ca3f016b37f922d515957af7118a206c8a25be9e3db8
          test "$(sha256sum "$owner_file" | cut -d ' ' -f1)" = 1134161a9cf7b0272505f1d5c9dd00a7b3f9b66a9ef213a83e340cc709e83a91
          git diff --quiet
          git diff --cached --check
          git diff --cached --numstat "$CANDIDATE_TREE" > "$evidence/recovery-test-delta.numstat"
          printf '%s\n' "$(git write-tree)" > "$evidence/materialized-tree.txt"
          cp "$test_file" "$support_file" "$fixture_file" "$routing_file" "$owner_file" "$evidence/"
      - name: Install declared dependencies with canonical setup action
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "true"
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: "off"
      # No commit: a failing reproduction must run before production repair/hooks.
      # This does not waive or suppress later production candidate commit hooks.
      - name: Capture recovery cases and unchanged custody controls with native status
        id: custody
        run: |
          set -euo pipefail
          recipe="$RUNNER_TEMP/pr159178-warm-capture-recovery-red/capture.sh"
          test "$(sha256sum "$recipe" | cut -d ' ' -f1)" = "$CAPTURE_SHA256"
          bash "$recipe"
      - name: Capture canonical plugin production types after native test settlement
        id: types
        if: ${{ always() && !cancelled() && steps.setup.outcome == 'success' && steps.materialize.outcome == 'success' }}
        run: |
          set -euo pipefail
          recipe="$RUNNER_TEMP/pr159178-warm-capture-recovery-red/capture.sh"
          test "$(sha256sum "$recipe" | cut -d ' ' -f1)" = "$CAPTURE_SHA256"
          bash "$recipe" types
      - name: Record native workflow step outcomes
        if: ${{ always() }}
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pr159178-warm-capture-recovery-red"
          mkdir -p "$evidence"
          printf '%s\n' "$STEP_OUTCOMES" > "$evidence/step-outcomes.json"
          printf '%s\n' 'Unclassified capture-recovery capture. Inspect native statuses, named assertion failures, case counts, controls, and source integrity before calling this RED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Always upload capture-recovery RED evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr159178-warm-capture-recovery-red-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/pr159178-warm-capture-recovery-red/
