name: PR 135838 reviewed patch validation
run-name: pr135838-patch ${{ inputs.suite }} ${{ inputs.expected_tree }}
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact reviewed parent commit
        required: true
        type: string
      expected_tree:
        description: Exact reviewed candidate index tree
        required: true
        type: string
      patch_id:
        description: Reviewed proof-input patch identifier
        required: true
        type: string
      patch_sha256:
        description: Exact full-index patch digest
        required: true
        type: string
      suite:
        description: Fixed validation command set
        required: true
        type: choice
        options:
          [
            migration-native-diagnostic,
            custody-resume-red,
            custody-resume-focused,
            custody-resume-full,
            custody-resume-types,
            custody-resume-build,
            custody-resume-windows,
            input-full,
            attachment-resume-red,
            attachment-resume-full,
            attachment-main-refresh,
            attachment-resume-types,
            attachment-resume-build,
            provider-rebase-focused,
            provider-format-preparation,
            provider-resume-red,
            provider-resume-focused,
            provider-resume-full,
            provider-resume-types,
            provider-resume-test-types-a,
            provider-resume-test-types-b,
            provider-resume-plugin-test-types,
            provider-resume-api,
            provider-sdk-repair,
            provider-type-inventory,
            provider-routing-repair,
            provider-upgrade-harness,
            provider-upgrade-harness-red,
            provider-resume-build,
            provider-resume-process,
            transport-fixture-repair,
            transport-resume-red,
            transport-resume-full,
            transport-main-refresh,
            transport-resume-types,
            transport-resume-build,
            provider-resume-smoke,
            input-delivery-red,
            input-delivery-full,
            input-delivery-types,
            input-delivery-build,
            input-refresh-red,
            input-refresh-full,
            input-refresh-types,
            input-refresh-test-types,
            input-refresh-build,
            provider-full,
            transport-full,
            input-authority-red,
            input-authority-full,
            credential-authority-red,
            custody-authority,
            execution-authority,
            desktop-authority-red,
            desktop-authority-full,
            identity-sdk,
            identity-api,
            identity-types,
            native-fixture-red,
            native-gateway-16,
            native-gateway-30,
            settlement-red,
            settlement-full,
            settlement-types,
            settlement-native-9,
            settlement-native-25,
            settlement-native-31,
            settlement-native-35,
            provider-process-authority,
            checkpoint-red,
            checkpoint-full,
            checkpoint-types,
            checkpoint-integration,
            checkpoint-sql-red,
            checkpoint-sql-full,
            checkpoint-sql-types,
            checkpoint-sql-test-types,
            checkpoint-git-fixture,
            checkpoint-wrapper,
            checkpoint-sql-build,
          ]
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'roboclaw-bot/openclaw' && inputs.suite != 'migration-native-diagnostic'
    runs-on: ${{ inputs.suite == 'custody-resume-windows' && 'windows-2025' || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PATCH_ID: ${{ inputs.patch_id }}
      PATCH_SHA256: ${{ inputs.patch_sha256 }}
      SUITE: ${{ inputs.suite }}
      REBASE_RECIPE_SHA256: '529dc87d88ffdc133531efbb1b37dc8f8eba32967edda91e87861606c2babd88'
      FORMAT_RECIPE_SHA256: 5fb2a89715ef6043874bd0cc037fcf4a705638f119a4c0d7b6f0e2ccd324ae6c
      FORMAT_PATCH_DATA_SHA256: d4a76a40ce57fefd9e4edd3f37824a025e675acc07fb901d6ab3fb292c4df446
      SAME_COMMIT_SOURCE_SHA256: '17e6e7a52e2a7c8072af6ec6e439438acb3d76ca056b54c8ac390cccd3a6db77'
      REBASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Validate immutable inputs
        id: input_guard
        env:
          REBASE_HOSTED: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PATCH_ID" =~ ^[a-z0-9-]+$ ]]
          case "$SUITE" in provider-format-preparation|provider-rebase-focused|provider-routing-repair|provider-type-inventory|provider-upgrade-harness|provider-upgrade-harness-red|attachment-main-refresh|provider-sdk-repair|custody-resume-red|custody-resume-focused|custody-resume-full|custody-resume-types|custody-resume-build|custody-resume-windows|transport-main-refresh|transport-fixture-repair|attachment-resume-red|attachment-resume-full|attachment-resume-types|attachment-resume-build|provider-resume-red|provider-resume-focused|provider-resume-full|provider-resume-types|provider-resume-test-types-a|provider-resume-test-types-b|provider-resume-plugin-test-types|provider-resume-api|provider-resume-build|provider-resume-process|transport-resume-red|transport-resume-full|transport-resume-types|transport-resume-build|provider-resume-smoke|input-delivery-red|input-delivery-full|input-delivery-types|input-delivery-build|input-refresh-red|input-refresh-full|input-refresh-types|input-refresh-test-types|input-refresh-build|input-full|provider-full|transport-full|input-authority-red|input-authority-full|credential-authority-red|custody-authority|execution-authority|desktop-authority-red|desktop-authority-full|identity-sdk|identity-api|identity-types|native-fixture-red|native-gateway-16|native-gateway-30|settlement-red|settlement-full|settlement-types|settlement-native-9|settlement-native-25|settlement-native-31|settlement-native-35|provider-process-authority|checkpoint-red|checkpoint-full|checkpoint-types|checkpoint-integration|checkpoint-sql-red|checkpoint-sql-full|checkpoint-sql-types|checkpoint-sql-build|checkpoint-sql-test-types|checkpoint-git-fixture|checkpoint-wrapper) ;; *) exit 2 ;; esac
          case "$SUITE" in
            provider-resume-build|provider-resume-api|provider-resume-test-types-a|provider-resume-test-types-b|provider-resume-plugin-test-types)
              echo 'same_commit=true' >> "$GITHUB_OUTPUT"
              echo 'SAME_COMMIT_SOURCE_SHA256=59c61afc45e4901240343f16c24a9594d58946ef3cf7fe3bd2add9c216dad3bb' >> "$GITHUB_ENV"
              mkdir -p "$RUNNER_TEMP/pr159178-same-commit"
              test "$BASE_SHA" = 0edae198d278686e16426f7ad254d0341bd6e3d3
              test "$EXPECTED_TREE" = e84e634a10fa84314b04119bd44d3a4a233a2999
              test "$PATCH_ID" = provider-same-commit
              test "$PATCH_SHA256" = '7c8a09a759f3719fe60d4cb2f09ca8b859161219e93ee99060d6d5255ec4b08b'
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$GITHUB_REF" = refs/heads/main
              test "$GITHUB_SHA" = "$REBASE_WORKFLOW_SHA"
              test "$REBASE_HOSTED" = github-hosted
              test "$RUNNER_OS" = Linux
              printf 'SAME_COMMIT_HOSTED=%s\n' "$REBASE_HOSTED" >> "$GITHUB_ENV"
              ;;
          esac
          if [[ "$SUITE" == provider-rebase-focused ]]; then
            mkdir -p "$RUNNER_TEMP/pr159178-rebase"
            test "$BASE_SHA" = fd0b54a58f93b68a49eb07695705cd770ebb91b1
            test "$PATCH_ID" = provider-rebase-current
            test "$EXPECTED_TREE" = 'dcf5d717b4a29b6b82d67d3acb57bf3f55ab300a'
            test "$PATCH_SHA256" = '4bb4a47f60de15bde0794c25eaa2a5bc8310861f26c6b082920b966a0623a746'
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_SHA" = "$REBASE_WORKFLOW_SHA"
            test "$REBASE_HOSTED" = github-hosted
            test "$RUNNER_OS" = Linux
            # Runner context exists at the executing step, not job-env evaluation.
            # Carry only the checked native environment fact into later recipe steps.
            printf 'REBASE_HOSTED=%s\n' "$REBASE_HOSTED" >> "$GITHUB_ENV"
          fi
          if [[ "$SUITE" == provider-format-preparation ]]; then
            mkdir -p "$RUNNER_TEMP/pr159178-format-preparation"
            test "$BASE_SHA" = fd0b54a58f93b68a49eb07695705cd770ebb91b1
            test "$EXPECTED_TREE" = 3c74e6bef80da1415990ccc4043636e5202c040d
            test "$PATCH_ID" = provider-format-preparation
            test "$PATCH_SHA256" = 40ec0108347e89dc9031b82d49baf2067f9c9ce0d8fd46cbcbe9770e26c3c28d
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_SHA" = "$REBASE_WORKFLOW_SHA"
            test "$REBASE_HOSTED" = github-hosted
            test "$RUNNER_OS" = Linux
            printf 'FORMAT_HOSTED=%s\n' "$REBASE_HOSTED" >> "$GITHUB_ENV"
          fi
          if [[ "$SUITE" == provider-routing-repair ]]; then
            mkdir -p "$RUNNER_TEMP/pr159178-same-commit"
            test "$BASE_SHA" = e0a53eaa04e450cf9c287e2f8ae1f687f3afdf23
            test "$PATCH_ID" = provider-routing-repair-20260927
            test "$EXPECTED_TREE" = e84e634a10fa84314b04119bd44d3a4a233a2999
            test "$PATCH_SHA256" = 298c200e081b400b07197fa4dd061ea40aa43cf44dd69b2b19a596251f58a0c1
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_SHA" = "$REBASE_WORKFLOW_SHA"
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$REBASE_HOSTED" = github-hosted
            test "$RUNNER_OS" = Linux
            test "$RUNNER_ARCH" = X64
            printf 'SHADOW_HOSTED=%s\n' "$REBASE_HOSTED" >> "$GITHUB_ENV"
          fi
          if [[ "$SUITE" == provider-type-inventory ]]; then
            test "$BASE_SHA" = e0c476d18d326d05468135a37ed108e07eb8a466
            test "$PATCH_ID" = provider-type-inventory-20260927
            test "$EXPECTED_TREE" = 6f3b1f51565d6e06af4eeb314c07833674edc3ef
            test "$PATCH_SHA256" = aedb1112d9ea2d418244f2e32a5360fd504b12c322678a23a66d046dfb39ad57
          fi
          if [[ "$SUITE" == provider-upgrade-harness || "$SUITE" == provider-upgrade-harness-red ]]; then
            test "$BASE_SHA" = d06b334112a2fae431d2ddd5450ebc2064469317
            test "$PATCH_ID" = provider-upgrade-harness-v5
            test "$EXPECTED_TREE" = ff877b04d5ed626b2d8c6dda03f7eb030792070e
            test "$PATCH_SHA256" = 7644896c08a69ea488f78bdec70aebbb16385ec7402bba7a29b23f796ece7eca
          fi
          if [[ "$SUITE" == custody-resume-* ]]; then
            test "$BASE_SHA" = 24c7bd68b4bb683c0f2eb55c278534d635a50403
            case "$PATCH_ID:$EXPECTED_TREE:$PATCH_SHA256" in
              custody-repaired:a74dd326fce20899b134c79efa091fad9f4f74bf:e98b7a9c71e5943d3aaba0672714ee6c13ae831606f10c50359f0224362abd5e) ;;
              custody-repaired-tests-only:47bf1a8100a945de51060afc2677769b453cd14d:ba439935add863c187ad82430a3b7f7843ab67f0fc8b588fea0c590c011aa20e) ;;
              custody-review-baseline:82d7765074cf158d8048ad19c7ea383b3d48d289:7ef70f42823bd4581dc7ba9c52b4e709888713287891203538994cb1bee30b9a) ;;
              *) exit 2 ;;
            esac
            case "$SUITE:$PATCH_ID" in
              custody-resume-red:custody-repaired-tests-only|custody-resume-red:custody-review-baseline|custody-resume-windows:*) ;;
              custody-resume-focused:custody-repaired|custody-resume-full:custody-repaired|custody-resume-types:custody-repaired|custody-resume-build:custody-repaired) ;;
              *) exit 2 ;;
            esac
          fi
      - name: Verify Windows controller tool availability
        if: inputs.suite == 'custody-resume-windows'
        run: |
          set -euo pipefail
          for tool in bash git jq base64 sha256sum node; do command -v "$tool"; done
          bash --version
          git --version
          jq --version
          test "$(printf YWJj | base64 --decode)" = abc
          test "$(printf abc | sha256sum | cut -d " " -f1)" = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          node -e 'if (process.platform !== "win32") throw new Error("Expected actual Windows runner"); console.log(JSON.stringify({platform:process.platform,node:process.version,imageOS:process.env.ImageOS,imageVersion:process.env.ImageVersion}));'
      - name: Check out reviewed controller and patch data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ (inputs.suite == 'provider-rebase-focused' || inputs.suite == 'provider-format-preparation' || inputs.suite == 'provider-routing-repair' || steps.input_guard.outputs.same_commit == 'true') && 2 || 1 }}
          persist-credentials: false
      - name: Preserve and verify patch data
        id: preserve_inputs
        run: |
          set -euo pipefail
          if [[ "${{ steps.input_guard.outputs.same_commit }}" == true ]]; then
            evidence="$RUNNER_TEMP/pr159178-same-commit"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git show -s --format=%P HEAD)" = e38d4fbc8af63e7125e2cec80de30a66c7e3d2a0
            test "$(git rev-parse HEAD^1^{tree})" = f230043c2c1abd2085bcdfb4f417dcdf1675b475
            git diff --name-status HEAD^ HEAD > "$evidence/controller-paths.txt"
            cat > "$evidence/expected-controller-paths.txt" <<'PUBLICATION_PATHS'
          M	.github/proof-inputs/pr135838/publication/artifact.py
          M	.github/workflows/pr135838-patch-validation.yml
          PUBLICATION_PATHS
            cmp "$evidence/expected-controller-paths.txt" "$evidence/controller-paths.txt"
            for path in .github/proof-inputs/pr135838/provider-resume-api.sh .github/proof-inputs/pr135838/provider-resume-build.sh .github/proof-inputs/pr135838/provider-resume-plugin-test-types.sh .github/proof-inputs/pr135838/provider-resume-test-types-a.sh .github/proof-inputs/pr135838/provider-resume-test-types-b.sh .github/proof-inputs/pr135838/provider-same-commit-source.sh .github/proof-inputs/pr135838/provider-same-commit.payload.json .github/proof-inputs/pr135838/publication/artifact.py .github/workflows/pr135838-patch-validation.yml; do
              test "$(git ls-tree HEAD "$path" | cut -d " " -f1)" = 100644
            done
            cp .github/proof-inputs/pr135838/provider-same-commit.payload.json "$RUNNER_TEMP/same-commit-payload.json"
            cp .github/proof-inputs/pr135838/provider-same-commit-source.sh "$RUNNER_TEMP/same-commit-source.sh"
            cp ".github/proof-inputs/pr135838/$SUITE.sh" "$RUNNER_TEMP/validate-candidate.sh"
            test "$(sha256sum "$RUNNER_TEMP/same-commit-payload.json" | cut -d ' ' -f1)" = "$PATCH_SHA256"
            test "$(sha256sum "$RUNNER_TEMP/same-commit-source.sh" | cut -d ' ' -f1)" = "$SAME_COMMIT_SOURCE_SHA256"
            case "$SUITE" in
              provider-resume-build) recipe_sha='cc72dc5b2f3d0e24acddb77fbeb0d5a1e37584d9a98369bc089a66136e10bd27' ;;
              provider-resume-api) recipe_sha='7928f74ef3e9792512e26841933b0b5b1abce8bd133a14d839ecdaf1da18a0d1' ;;
              provider-resume-test-types-a) recipe_sha='bb3c2ac007225db5c21d269b35aac429ba1c3d60b6ac51e3d083d102a7c761b4' ;;
              provider-resume-test-types-b) recipe_sha='a40a5f9010c89dad1789b7ca692c491e93a5ab92ac3dbf441310cb2ac431a8e3' ;;
              provider-resume-plugin-test-types) recipe_sha='535dc8e9700e33db7c18e6c1c3a61421d1aa8bcabb9295b6e145d02f7076b1af' ;;
            esac
            test "$(sha256sum "$RUNNER_TEMP/validate-candidate.sh" | cut -d ' ' -f1)" = "$recipe_sha"
            cp "$RUNNER_TEMP/same-commit-payload.json" "$RUNNER_TEMP/same-commit-source.sh" "$RUNNER_TEMP/validate-candidate.sh" "$evidence/"
            cp .github/workflows/pr135838-patch-validation.yml "$evidence/controller-workflow.yml"
            git show -s --format='%H%n%P%n%T' HEAD > "$evidence/controller-identity.txt"
            if [[ "$SUITE" == provider-resume-build ]]; then
              cp .github/proof-inputs/pr135838/publication/artifact.py "$RUNNER_TEMP/publication-artifact.py"
              test "$(sha256sum "$RUNNER_TEMP/publication-artifact.py" | cut -d " " -f1)" = 8b5729cb870afc2e561230a831ae54935e31cd5b91d278e17d37477b08974b72
            fi
          elif [[ "$SUITE" == provider-rebase-focused ]]; then
            evidence="$RUNNER_TEMP/pr159178-rebase"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git show -s --format=%P HEAD)" = '65662a1de68b93bc6c8ece347a5ea1c4303d7ef1'
            test "$(git rev-parse HEAD^1^{tree})" = '78ce274c3cee0dcfdebf30f0ee030f71338ba3dd'
            git diff --name-status HEAD^ HEAD > "$evidence/controller-paths.txt"
            printf 'M\t%s\n' .github/proof-inputs/pr135838/provider-rebase-current.payload.json .github/proof-inputs/pr135838/provider-rebase-focused.sh .github/workflows/pr135838-patch-validation.yml > "$evidence/expected-controller-paths.txt"
            cmp "$evidence/expected-controller-paths.txt" "$evidence/controller-paths.txt"
            test "$(git ls-tree HEAD .github/proof-inputs/pr135838/provider-rebase-current.payload.json | cut -d ' ' -f1)" = 100644
            test "$(git ls-tree HEAD .github/proof-inputs/pr135838/provider-rebase-focused.sh | cut -d ' ' -f1)" = 100644
            cp .github/proof-inputs/pr135838/provider-rebase-current.payload.json "$RUNNER_TEMP/rebase-payload.json"
            cp .github/proof-inputs/pr135838/provider-rebase-focused.sh "$RUNNER_TEMP/validate-candidate.sh"
            test "$(sha256sum "$RUNNER_TEMP/rebase-payload.json" | cut -d ' ' -f1)" = "$PATCH_SHA256"
            test "$(sha256sum "$RUNNER_TEMP/validate-candidate.sh" | cut -d ' ' -f1)" = "$REBASE_RECIPE_SHA256"
            cp "$RUNNER_TEMP/rebase-payload.json" "$evidence/"
            cp "$RUNNER_TEMP/validate-candidate.sh" "$evidence/controller-recipe.sh"
            cp .github/workflows/pr135838-patch-validation.yml "$evidence/controller-workflow.yml"
            git show -s --format='%H%n%P%n%T' HEAD > "$evidence/controller-identity.txt"
          else
            base64 --decode ".github/proof-inputs/pr135838/$PATCH_ID.patch.b64" > "$RUNNER_TEMP/candidate.patch"
            test "$(sha256sum "$RUNNER_TEMP/candidate.patch" | cut -d " " -f1)" = "$PATCH_SHA256"
            cp ".github/proof-inputs/pr135838/$SUITE.sh" "$RUNNER_TEMP/validate-candidate.sh"
            if [[ "$SUITE" == provider-routing-repair ]]; then
              evidence="$RUNNER_TEMP/pr159178-same-commit"
              test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
              test "$(git show -s --format=%P HEAD)" = 65ac9d7938639d65721958ef4baf22d335e9856f
              test "$(git rev-parse HEAD^1^{tree})" = e4ca5d79d7cf27dd7260f9998b32db682fb68bca
              git diff --name-status HEAD^ HEAD > "$evidence/controller-paths.txt"
              printf 'M\t%s\n' .github/proof-inputs/pr135838/provider-routing-repair-20260927.patch.b64 .github/proof-inputs/pr135838/provider-routing-repair.sh .github/workflows/pr135838-patch-validation.yml > "$evidence/expected-controller-paths.txt"
              cmp "$evidence/expected-controller-paths.txt" "$evidence/controller-paths.txt"
              for path in .github/proof-inputs/pr135838/provider-routing-repair-20260927.patch.b64 .github/proof-inputs/pr135838/provider-routing-repair.sh .github/workflows/pr135838-patch-validation.yml; do
                test "$(git ls-tree HEAD "$path" | cut -d ' ' -f1)" = 100644
              done
              test "$(sha256sum "$RUNNER_TEMP/validate-candidate.sh" | cut -d ' ' -f1)" = 1bf93d69cafa858bdb87d4723d690cca11c0082774719c08acc8e91543e928fb
              test "$(sha256sum ".github/proof-inputs/pr135838/$PATCH_ID.patch.b64" | cut -d ' ' -f1)" = cd8c13323ec8d30cb3090a5215224a0604e77102d95b7fb0ffff13bce6e87188
              git diff --quiet HEAD
              cp "$RUNNER_TEMP/candidate.patch" "$evidence/materialization.patch"
              cp "$RUNNER_TEMP/validate-candidate.sh" "$evidence/controller-recipe.sh"
              cp .github/workflows/pr135838-patch-validation.yml "$evidence/controller-workflow.yml"
              git show -s --format='%H%n%P%n%T' HEAD > "$evidence/controller-identity.txt"
            fi
            if [[ "$SUITE" == provider-format-preparation ]]; then
              evidence="$RUNNER_TEMP/pr159178-format-preparation"
              test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
              test "$(git show -s --format=%P HEAD)" = 3fb77c98bb611fa8f75b3f3f568827d1031dba0e
              test "$(git rev-parse HEAD^1^{tree})" = 64a565783b6dff45174111424e0c1e3cbd0eedd2
              git diff --name-status HEAD^ HEAD > "$evidence/controller-paths.txt"
              printf 'M\t%s\n' .github/proof-inputs/pr135838/provider-format-preparation.patch.b64 .github/proof-inputs/pr135838/provider-format-preparation.sh > "$evidence/expected-controller-paths.txt"
              printf 'M\t%s\n' .github/workflows/pr135838-patch-validation.yml >> "$evidence/expected-controller-paths.txt"
              cmp "$evidence/expected-controller-paths.txt" "$evidence/controller-paths.txt"
              for path in .github/proof-inputs/pr135838/provider-format-preparation.patch.b64 .github/proof-inputs/pr135838/provider-format-preparation.sh .github/workflows/pr135838-patch-validation.yml; do
                test "$(git ls-tree HEAD "$path" | cut -d ' ' -f1)" = 100644
              done
              test "$(sha256sum .github/proof-inputs/pr135838/provider-format-preparation.patch.b64 | cut -d ' ' -f1)" = "$FORMAT_PATCH_DATA_SHA256"
              test "$(sha256sum "$RUNNER_TEMP/validate-candidate.sh" | cut -d ' ' -f1)" = "$FORMAT_RECIPE_SHA256"
              git diff --quiet HEAD
              cp "$RUNNER_TEMP/candidate.patch" "$evidence/materialization.patch"
              cp "$RUNNER_TEMP/validate-candidate.sh" "$evidence/controller-recipe.sh"
              cp .github/workflows/pr135838-patch-validation.yml "$evidence/controller-workflow.yml"
              git show -s --format='%H%n%P%n%T' HEAD > "$evidence/controller-identity.txt"
            fi
            if [[ "$SUITE" == provider-upgrade-harness-red ]]; then
              base64 --decode .github/proof-inputs/pr135838/provider-upgrade-harness-regression-owners.patch.b64 > "$RUNNER_TEMP/harness-regression-owners.patch"
