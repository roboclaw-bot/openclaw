name: PR 135838 reviewed patch validation
run-name: pr135838-patch ${{ inputs.suite }} ${{ inputs.expected_tree }}
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact reviewed parent commit
        required: true
        type: string
      expected_tree:
        description: Exact reviewed candidate index tree
        required: true
        type: string
      patch_id:
        description: Reviewed proof-input patch identifier
        required: true
        type: string
      patch_sha256:
        description: Exact full-index patch digest
        required: true
        type: string
      suite:
        description: Fixed validation command set
        required: true
        type: choice
        options:
          [
            input-full,
            provider-full,
            transport-full,
            input-authority-red,
            input-authority-full,
            credential-authority-red,
            custody-authority,
            execution-authority,
            desktop-authority-red,
            desktop-authority-full,
            identity-sdk,
            identity-api,
            identity-types,
            native-fixture-red,
            native-gateway-16,
            native-gateway-30,
            settlement-red,
            settlement-full,
            settlement-types,
            settlement-native-9,
            settlement-native-25,
            settlement-native-31,
            settlement-native-35,
            provider-process-authority,
            checkpoint-red,
            checkpoint-full,
            checkpoint-types,
            checkpoint-integration,
            checkpoint-sql-red,
          ]
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'roboclaw-bot/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PATCH_ID: ${{ inputs.patch_id }}
      PATCH_SHA256: ${{ inputs.patch_sha256 }}
      SUITE: ${{ inputs.suite }}
    steps:
      - name: Validate immutable inputs
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PATCH_ID" =~ ^[a-z0-9-]+$ ]]
          case "$SUITE" in input-full|provider-full|transport-full|input-authority-red|input-authority-full|credential-authority-red|custody-authority|execution-authority|desktop-authority-red|desktop-authority-full|identity-sdk|identity-api|identity-types|native-fixture-red|native-gateway-16|native-gateway-30|settlement-red|settlement-full|settlement-types|settlement-native-9|settlement-native-25|settlement-native-31|settlement-native-35|provider-process-authority|checkpoint-red|checkpoint-full|checkpoint-types|checkpoint-integration|checkpoint-sql-red) ;; *) exit 2 ;; esac
      - name: Check out reviewed controller and patch data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve and verify patch data
        run: |
          set -euo pipefail
          base64 --decode ".github/proof-inputs/pr135838/$PATCH_ID.patch.b64" > "$RUNNER_TEMP/candidate.patch"
          test "$(sha256sum "$RUNNER_TEMP/candidate.patch" | cut -d " " -f1)" = "$PATCH_SHA256"
          cp ".github/proof-inputs/pr135838/$SUITE.sh" "$RUNNER_TEMP/validate-candidate.sh"
      - name: Check out exact parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize only the reviewed candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --quiet HEAD
          git apply --index --check "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --quiet
          git diff --cached --check
          git merge-base --is-ancestor 3e8b396a7dc833185c0fdba33efadef6826eeda7 HEAD
      - name: Install declared dependencies in the isolated normal checkout
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "true"
          cache-mode: "restore"
      - name: Commit exact reviewed tree with normal hooks enabled
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --quiet
          test -z "$(git config --get hooks.blockedLiteralsFile || true)"
          case "$SUITE" in
            input-full)
              subject="test(gateway): keep reset authority coverage within file budgets"
              detail="Preserve case names, order, hooks, mocks and assertions in focused test support."
              ;;
            input-authority-red|input-authority-full)
              subject="test(gateway): prove input custody with real run authority"
              detail="Observe real owner closure and final effects while preserving accepted custody and reset retries."
              ;;
            credential-authority-red)
              subject="test(workers): reproduce attachment after admitted authority closes"
              detail="Observe queue and bundle waits with real admission closure and persisted attachment effects."
              ;;
            custody-authority)
              subject="test(workers): exercise retained result custody through real lifecycle transitions"
              detail="Observe drain, cancellation, recovery and nonce cleanup without replacing owner assertions."
              ;;
            execution-authority)
              subject="test(workers): exercise real prepared execution owner closure"
              detail="Observe agent, worker and repository owners across retained-callback boundaries."
              ;;
            desktop-authority-red|desktop-authority-full|identity-sdk|identity-api|identity-types)
              subject="fix(workers): stop desktop identity preparation with its owner"
              detail="Bind preparation to desktop stop, replacement and timeout while preserving independent cleanup."
              ;;
            native-fixture-red|native-gateway-16|native-gateway-30)
              subject="test(gateway): drain fixture storage before resetting task owners"
              detail="Preserve live native borrowers and original Gateway shard assertions."
              ;;
            settlement-red|settlement-full|settlement-types|settlement-native-9|settlement-native-25|settlement-native-31|settlement-native-35)
              subject="fix(gateway): retain prepared placement facts through row admission"
              detail="Preserve exact-read custody and synchronize maintenance fixtures with their producing owners."
              ;;
            checkpoint-red|checkpoint-full|checkpoint-types|checkpoint-integration|checkpoint-sql-red)
              subject="fix(workers): stop checkpoint writes after authority closes"
              detail="Preserve current Git input admission and cleanup while fencing deferred checkpoint publication."
              ;;
            provider-process-authority)
              subject="test(workers): prove provider lifetime with real host owners and local process I/O"
              detail="Exercise actual returned closures and service stop with explicit synthetic CLI boundaries."
              ;;
            provider-full)
              subject="fix(workers): reject provider work after invocation closes"
              detail="Bind provider work to live invocation authority while preserving independent cleanup."
              ;;
            transport-full)
              subject="fix(workers): reject stale workspace transfer operations"
              detail="Carry caller authority through initialization and transfer; preserve established custody."
              ;;
            *) exit 2 ;;
          esac
          printf '%s\n\n%s\n\n' "$subject" "$detail" > "$RUNNER_TEMP/commit-message.txt"
          cat >> "$RUNNER_TEMP/commit-message.txt" <<'MESSAGE'
          Co-authored-by: sallyom <11166065+sallyom@users.noreply.github.com>
          Co-authored-by: vincentkoc <25068+vincentkoc@users.noreply.github.com>
          MESSAGE
          git -c core.hooksPath=git-hooks -c user.name=roboclaw-bot -c user.email=309084314+roboclaw-bot@users.noreply.github.com commit --file "$RUNNER_TEMP/commit-message.txt"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git diff --quiet HEAD
          git log -1 --format="%H%n%T%n%B"
      - name: Run the controller-owned validation recipe
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/validate-candidate.sh"
          git diff --quiet HEAD
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
      - name: Export verified commit without repository write credentials
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/candidate.bundle" "$BASE_SHA..HEAD"
          git bundle verify "$RUNNER_TEMP/candidate.bundle"
          sdk_report_sha=""
          if [[ "$SUITE" == identity-sdk || "$SUITE" == identity-api ]]; then
            sdk_report_sha="$(sha256sum "$RUNNER_TEMP/candidate-sdk-api.json" | cut -d " " -f1)"
          fi
          jq -n --arg commit "$(git rev-parse HEAD)" --arg parent "$BASE_SHA" --arg tree "$EXPECTED_TREE" --arg patch "$PATCH_SHA256" --arg suite "$SUITE" --arg sdkReportSha "$sdk_report_sha" '{commit:$commit,parent:$parent,tree:$tree,patchSha256:$patch,suite:$suite,compatibilityReview:(if ($suite == "identity-sdk" or $suite == "identity-api") then {status:"required",reportSha256:$sdkReportSha} else null end)}' > "$RUNNER_TEMP/candidate.json"
          cat "$RUNNER_TEMP/candidate.json"
      - name: Upload the verified commit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-candidate
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate.bundle
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate-sdk-api.json
            ${{ runner.temp }}/candidate-sdk-api.txt
