name: PR 135838 reviewed patch validation
run-name: pr135838-patch ${{ inputs.suite }} ${{ inputs.expected_tree }}
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact reviewed parent commit
        required: true
        type: string
      expected_tree:
        description: Exact reviewed candidate index tree
        required: true
        type: string
      patch_id:
        description: Reviewed proof-input patch identifier
        required: true
        type: string
      patch_sha256:
        description: Exact full-index patch digest
        required: true
        type: string
      suite:
        description: Fixed validation command set
        required: true
        type: choice
        options:
          [
            custody-resume-red,
            custody-resume-focused,
            custody-resume-full,
            custody-resume-types,
            custody-resume-build,
            custody-resume-windows,
            input-full,
            attachment-resume-red,
            attachment-resume-full,
            attachment-main-refresh,
            attachment-resume-types,
            attachment-resume-build,
            provider-rebase-focused,
            provider-resume-red,
            provider-resume-focused,
            provider-resume-full,
            provider-resume-types,
            provider-resume-test-types-a,
            provider-resume-test-types-b,
            provider-resume-plugin-test-types,
            provider-resume-api,
            provider-sdk-repair,
            provider-type-inventory,
            provider-routing-repair,
            provider-upgrade-harness,
            provider-upgrade-harness-red,
            provider-resume-build,
            provider-resume-process,
            transport-fixture-repair,
            transport-resume-red,
            transport-resume-full,
            transport-main-refresh,
            transport-resume-types,
            transport-resume-build,
            provider-resume-smoke,
            input-delivery-red,
            input-delivery-full,
            input-delivery-types,
            input-delivery-build,
            input-refresh-red,
            input-refresh-full,
            input-refresh-types,
            input-refresh-test-types,
            input-refresh-build,
            provider-full,
            transport-full,
            input-authority-red,
            input-authority-full,
            credential-authority-red,
            custody-authority,
            execution-authority,
            desktop-authority-red,
            desktop-authority-full,
            identity-sdk,
            identity-api,
            identity-types,
            native-fixture-red,
            native-gateway-16,
            native-gateway-30,
            settlement-red,
            settlement-full,
            settlement-types,
            settlement-native-9,
            settlement-native-25,
            settlement-native-31,
            settlement-native-35,
            provider-process-authority,
            checkpoint-red,
            checkpoint-full,
            checkpoint-types,
            checkpoint-integration,
            checkpoint-sql-red,
            checkpoint-sql-full,
            checkpoint-sql-types,
            checkpoint-sql-test-types,
            checkpoint-git-fixture,
            checkpoint-wrapper,
            checkpoint-sql-build,
          ]
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'roboclaw-bot/openclaw'
    runs-on: ${{ inputs.suite == 'custody-resume-windows' && 'windows-2025' || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PATCH_ID: ${{ inputs.patch_id }}
      PATCH_SHA256: ${{ inputs.patch_sha256 }}
      SUITE: ${{ inputs.suite }}
      REBASE_RECIPE_SHA256: 706790b73da7dc6e6187e8ce1650cbde048910dfcdab46b20f4f14d355c6bda7
      REBASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Validate immutable inputs
        id: input_guard
        env:
          REBASE_HOSTED: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PATCH_ID" =~ ^[a-z0-9-]+$ ]]
          case "$SUITE" in provider-rebase-focused|provider-routing-repair|provider-type-inventory|provider-upgrade-harness|provider-upgrade-harness-red|attachment-main-refresh|provider-sdk-repair|custody-resume-red|custody-resume-focused|custody-resume-full|custody-resume-types|custody-resume-build|custody-resume-windows|transport-main-refresh|transport-fixture-repair|attachment-resume-red|attachment-resume-full|attachment-resume-types|attachment-resume-build|provider-resume-red|provider-resume-focused|provider-resume-full|provider-resume-types|provider-resume-test-types-a|provider-resume-test-types-b|provider-resume-plugin-test-types|provider-resume-api|provider-resume-build|provider-resume-process|transport-resume-red|transport-resume-full|transport-resume-types|transport-resume-build|provider-resume-smoke|input-delivery-red|input-delivery-full|input-delivery-types|input-delivery-build|input-refresh-red|input-refresh-full|input-refresh-types|input-refresh-test-types|input-refresh-build|input-full|provider-full|transport-full|input-authority-red|input-authority-full|credential-authority-red|custody-authority|execution-authority|desktop-authority-red|desktop-authority-full|identity-sdk|identity-api|identity-types|native-fixture-red|native-gateway-16|native-gateway-30|settlement-red|settlement-full|settlement-types|settlement-native-9|settlement-native-25|settlement-native-31|settlement-native-35|provider-process-authority|checkpoint-red|checkpoint-full|checkpoint-types|checkpoint-integration|checkpoint-sql-red|checkpoint-sql-full|checkpoint-sql-types|checkpoint-sql-build|checkpoint-sql-test-types|checkpoint-git-fixture|checkpoint-wrapper) ;; *) exit 2 ;; esac
          if [[ "$SUITE" == provider-rebase-focused ]]; then
            mkdir -p "$RUNNER_TEMP/pr159178-rebase"
            test "$BASE_SHA" = d247932b3075cf3a3975f64275e3eab9cd1d37d0
            test "$PATCH_ID" = provider-rebase-current
            test "$EXPECTED_TREE" = 2596c1fa0781b0d2d28b23186da2a429151d1fc7
            test "$PATCH_SHA256" = 439c936d03ceb70c65ccb87d24f5fa894c9d0b0fd4658f16a28cfab4879de6f2
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_SHA" = "$REBASE_WORKFLOW_SHA"
            test "$REBASE_HOSTED" = github-hosted
            test "$RUNNER_OS" = Linux
            # Runner context exists at the executing step, not job-env evaluation.
            # Carry only the checked native environment fact into later recipe steps.
            printf 'REBASE_HOSTED=%s\n' "$REBASE_HOSTED" >> "$GITHUB_ENV"
          fi
          if [[ "$SUITE" == provider-routing-repair ]]; then
            test "$BASE_SHA" = e53ea87c66cb5d1deaefe5046069de4adbcde09a
            test "$PATCH_ID" = provider-routing-repair-20260927
            test "$EXPECTED_TREE" = 8d016974aecaddff23a9a86ff502f500980cbb4d
            test "$PATCH_SHA256" = 388710246627cfef1f16e41f34cfd4461e7a1a0f0eebfde7eb690e63ffacaba7
          fi
          if [[ "$SUITE" == provider-type-inventory ]]; then
            test "$BASE_SHA" = e0c476d18d326d05468135a37ed108e07eb8a466
            test "$PATCH_ID" = provider-type-inventory-20260927
            test "$EXPECTED_TREE" = 6f3b1f51565d6e06af4eeb314c07833674edc3ef
            test "$PATCH_SHA256" = aedb1112d9ea2d418244f2e32a5360fd504b12c322678a23a66d046dfb39ad57
          fi
          if [[ "$SUITE" == provider-upgrade-harness || "$SUITE" == provider-upgrade-harness-red ]]; then
            test "$BASE_SHA" = d06b334112a2fae431d2ddd5450ebc2064469317
            test "$PATCH_ID" = provider-upgrade-harness-v5
            test "$EXPECTED_TREE" = ff877b04d5ed626b2d8c6dda03f7eb030792070e
            test "$PATCH_SHA256" = 7644896c08a69ea488f78bdec70aebbb16385ec7402bba7a29b23f796ece7eca
          fi
          if [[ "$SUITE" == custody-resume-* ]]; then
            test "$BASE_SHA" = 24c7bd68b4bb683c0f2eb55c278534d635a50403
            case "$PATCH_ID:$EXPECTED_TREE:$PATCH_SHA256" in
              custody-repaired:a74dd326fce20899b134c79efa091fad9f4f74bf:e98b7a9c71e5943d3aaba0672714ee6c13ae831606f10c50359f0224362abd5e) ;;
              custody-repaired-tests-only:47bf1a8100a945de51060afc2677769b453cd14d:ba439935add863c187ad82430a3b7f7843ab67f0fc8b588fea0c590c011aa20e) ;;
              custody-review-baseline:82d7765074cf158d8048ad19c7ea383b3d48d289:7ef70f42823bd4581dc7ba9c52b4e709888713287891203538994cb1bee30b9a) ;;
              *) exit 2 ;;
            esac
            case "$SUITE:$PATCH_ID" in
              custody-resume-red:custody-repaired-tests-only|custody-resume-red:custody-review-baseline|custody-resume-windows:*) ;;
              custody-resume-focused:custody-repaired|custody-resume-full:custody-repaired|custody-resume-types:custody-repaired|custody-resume-build:custody-repaired) ;;
              *) exit 2 ;;
            esac
          fi
      - name: Verify Windows controller tool availability
        if: inputs.suite == 'custody-resume-windows'
        run: |
          set -euo pipefail
          for tool in bash git jq base64 sha256sum node; do command -v "$tool"; done
          bash --version
          git --version
          jq --version
          test "$(printf YWJj | base64 --decode)" = abc
          test "$(printf abc | sha256sum | cut -d " " -f1)" = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          node -e 'if (process.platform !== "win32") throw new Error("Expected actual Windows runner"); console.log(JSON.stringify({platform:process.platform,node:process.version,imageOS:process.env.ImageOS,imageVersion:process.env.ImageVersion}));'
      - name: Check out reviewed controller and patch data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ inputs.suite == 'provider-rebase-focused' && 2 || 1 }}
          persist-credentials: false
      - name: Preserve and verify patch data
        id: preserve_inputs
        run: |
          set -euo pipefail
          if [[ "$SUITE" == provider-rebase-focused ]]; then
            evidence="$RUNNER_TEMP/pr159178-rebase"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git show -s --format=%P HEAD)" = 8f3bbbc3b6d3990bd2b6593ed5315cacfd6e3e51
            git diff --name-status HEAD^ HEAD > "$evidence/controller-paths.txt"
            printf 'M\t%s\n' .github/proof-inputs/pr135838/provider-rebase-focused.sh .github/workflows/pr135838-patch-validation.yml > "$evidence/expected-controller-paths.txt"
            cmp "$evidence/expected-controller-paths.txt" "$evidence/controller-paths.txt"
            test "$(git ls-tree HEAD .github/proof-inputs/pr135838/provider-rebase-current.payload.json | cut -d ' ' -f1)" = 100644
            test "$(git ls-tree HEAD .github/proof-inputs/pr135838/provider-rebase-focused.sh | cut -d ' ' -f1)" = 100644
            cp .github/proof-inputs/pr135838/provider-rebase-current.payload.json "$RUNNER_TEMP/rebase-payload.json"
            cp .github/proof-inputs/pr135838/provider-rebase-focused.sh "$RUNNER_TEMP/validate-candidate.sh"
            test "$(sha256sum "$RUNNER_TEMP/rebase-payload.json" | cut -d ' ' -f1)" = "$PATCH_SHA256"
            test "$(sha256sum "$RUNNER_TEMP/validate-candidate.sh" | cut -d ' ' -f1)" = "$REBASE_RECIPE_SHA256"
            cp "$RUNNER_TEMP/rebase-payload.json" "$evidence/"
            cp "$RUNNER_TEMP/validate-candidate.sh" "$evidence/controller-recipe.sh"
            cp .github/workflows/pr135838-patch-validation.yml "$evidence/controller-workflow.yml"
            git show -s --format='%H%n%P%n%T' HEAD > "$evidence/controller-identity.txt"
          else
            base64 --decode ".github/proof-inputs/pr135838/$PATCH_ID.patch.b64" > "$RUNNER_TEMP/candidate.patch"
            test "$(sha256sum "$RUNNER_TEMP/candidate.patch" | cut -d " " -f1)" = "$PATCH_SHA256"
            cp ".github/proof-inputs/pr135838/$SUITE.sh" "$RUNNER_TEMP/validate-candidate.sh"
            if [[ "$SUITE" == provider-upgrade-harness-red ]]; then
              base64 --decode .github/proof-inputs/pr135838/provider-upgrade-harness-regression-owners.patch.b64 > "$RUNNER_TEMP/harness-regression-owners.patch"
              test "$(sha256sum "$RUNNER_TEMP/harness-regression-owners.patch" | cut -d " " -f1)" = 2c8b578e6364c1506b92038093082014cfd7c45b6b7d4dbf8a85539ad6014f2f
            fi
            if [[ "$SUITE" == transport-fixture-repair ]]; then
              cp .github/proof-inputs/pr135838/transport-ci-original-groups.json "$RUNNER_TEMP/transport-ci-original-groups.json"
              test "$(sha256sum "$RUNNER_TEMP/transport-ci-original-groups.json" | cut -d " " -f1)" = 3aad0a524a13cec6bf1fbaaf540b48c14df64e5197caaacf36edffbd8a29b204
            fi
          fi
      - name: Check out exact parent
        id: base_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          filter: ${{ inputs.suite == 'provider-upgrade-harness' && 'blob:none' || '' }}
          persist-credentials: false
      - name: Materialize only the reviewed candidate
        id: materialize
        run: |
          set -euo pipefail
          if [[ "$SUITE" == provider-rebase-focused ]]; then
            bash "$RUNNER_TEMP/validate-candidate.sh" materialize
          else
            test "$(git rev-parse HEAD)" = "$BASE_SHA"
            git diff --quiet HEAD
            git apply --index --check "$RUNNER_TEMP/candidate.patch"
            git apply --index "$RUNNER_TEMP/candidate.patch"
            test "$(git write-tree)" = "$EXPECTED_TREE"
            git diff --quiet
            git diff --cached --check
            git merge-base --is-ancestor 3e8b396a7dc833185c0fdba33efadef6826eeda7 HEAD
          fi
      - name: Install declared dependencies in the isolated normal checkout
        id: dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ inputs.suite == 'custody-resume-windows' && '24.21.0' || '24.19.0' }}
          install-bun: ${{ inputs.suite == 'custody-resume-windows' && 'false' || 'true' }}
          cache-mode: ${{ inputs.suite == 'provider-rebase-focused' && 'off' || 'restore' }}
      - name: Check formatting before the ordinary repair commit
        id: format
        if: inputs.suite == 'provider-rebase-focused'
        run: bash "$RUNNER_TEMP/validate-candidate.sh" format
      - name: Commit exact reviewed tree with normal hooks enabled
        if: inputs.suite != 'provider-rebase-focused'
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --quiet
          test -z "$(git config --get hooks.blockedLiteralsFile || true)"
          case "$SUITE" in
            provider-routing-repair)
              subject="test: keep worker invocation registration in canonical order"
              detail="Preserve every Gateway worker test while placing the invocation regression in the sorted routing inventory."
              ;;
            provider-type-inventory)
              subject="test: record worker-provider negative type assertions"
              detail="Keep the two intentional V1 compile-error fixtures explicit in the exact type-suppression inventory without weakening its scanner."
              ;;
            provider-upgrade-harness|provider-upgrade-harness-red)
              subject="test(workers): prove legacy provider state survives published upgrade"
              detail="Exercise the published updater, unchanged external provider and native worker custody with owned TLS nodes and joined cleanup."
              ;;
            custody-resume-red|custody-resume-focused|custody-resume-full|custody-resume-types|custody-resume-build|custody-resume-windows)
              subject="fix(workers): retain quiescence cleanup after caller authority closes"
              detail="Separate caller admission from acknowledged nonce cleanup and retain failed release custody without reviving the caller."
              ;;
            attachment-main-refresh|attachment-resume-red|attachment-resume-full|attachment-resume-types|attachment-resume-build)
              subject="fix(workers): stop queued attachments after caller authority closes"
              detail="Preserve caller authorization through queued credential admission without undoing committed attachment custody."
              ;;
            provider-sdk-repair|provider-resume-red|provider-resume-focused|provider-resume-full|provider-resume-types|provider-resume-test-types-a|provider-resume-test-types-b|provider-resume-plugin-test-types|provider-resume-api|provider-resume-build|provider-resume-smoke|provider-resume-process)
              subject="fix(workers): reject provider effects after invocation closes"
              detail="Carry existing live host authority through bundled provider effects while preserving independent cleanup and compatible legacy calls."
              ;;
            transport-main-refresh)
              subject="fix(workers): stop workspace transfers after caller authority closes"
              detail="Preserve reviewed transport authority and snapshot cleanup on current main, including the landed updater fixture repair."
              ;;
            transport-fixture-repair)
              subject="test(skills): join snapshot workers before fixture cleanup"
              detail="Drain accepted database resources before deleting their state root, retaining failed cleanup custody and existing assertions."
              ;;
            transport-resume-red|transport-resume-full|transport-resume-types|transport-resume-build)
              subject="fix(workers): stop workspace transfers after caller authority closes"
              detail="Preserve initiating authority through node and SSH startup and transfer while joining disposal under independent workspace custody."
              ;;
            input-delivery-red|input-delivery-full|input-delivery-types|input-delivery-build)
              subject="fix(gateway): retain strict reset delivery failures on replay"
              detail="Preserve committed reset idempotency without converting failed confirmation delivery into successful retry responses."
              ;;
            input-refresh-red|input-refresh-full|input-refresh-types|input-refresh-test-types|input-refresh-build)
              subject="fix(gateway): stop input effects after caller authority closes"
              detail="Preserve current caller and accepted-input custody, retain committed reset receipts, and prove the real authority boundaries."
              ;;
            input-full)
              subject="test(gateway): keep reset authority coverage within file budgets"
              detail="Preserve case names, order, hooks, mocks and assertions in focused test support."
              ;;
            input-authority-red|input-authority-full)
              subject="test(gateway): prove input custody with real run authority"
              detail="Observe real owner closure and final effects while preserving accepted custody and reset retries."
              ;;
            credential-authority-red)
              subject="test(workers): reproduce attachment after admitted authority closes"
              detail="Observe queue and bundle waits with real admission closure and persisted attachment effects."
              ;;
            custody-authority)
              subject="test(workers): exercise retained result custody through real lifecycle transitions"
              detail="Observe drain, cancellation, recovery and nonce cleanup without replacing owner assertions."
              ;;
            execution-authority)
              subject="test(workers): exercise real prepared execution owner closure"
              detail="Observe agent, worker and repository owners across retained-callback boundaries."
              ;;
            desktop-authority-red|desktop-authority-full|identity-sdk|identity-api|identity-types)
              subject="fix(workers): stop desktop identity preparation with its owner"
              detail="Bind preparation to desktop stop, replacement and timeout while preserving independent cleanup."
              ;;
            native-fixture-red|native-gateway-16|native-gateway-30)
              subject="test(gateway): drain fixture storage before resetting task owners"
              detail="Preserve live native borrowers and original Gateway shard assertions."
              ;;
            settlement-red|settlement-full|settlement-types|settlement-native-9|settlement-native-25|settlement-native-31|settlement-native-35)
              subject="fix(gateway): retain prepared placement facts through row admission"
              detail="Preserve exact-read custody and synchronize maintenance fixtures with their producing owners."
              ;;
            checkpoint-wrapper)
              subject="fix(workers): retain publication helpers in extracted PR wrappers"
              detail="Complete the canonical wrapper dependency inventory and use Git-native fixture object identities."
              ;;
            checkpoint-git-fixture)
              subject="fix(tests): construct checkpoint blob identities with Git"
              detail="Use the native Git object-id fixture helper without changing production cryptography or the SQL-cost oracle."
              ;;
            checkpoint-sql-full|checkpoint-sql-types|checkpoint-sql-build|checkpoint-sql-test-types)
              subject="refactor(workers): prepare publication checkpoint inputs off-thread"
              detail="Remove redundant Gateway payload copies while retaining current revision, import, and final-input fences."
              ;;
            checkpoint-red|checkpoint-full|checkpoint-types|checkpoint-integration|checkpoint-sql-red)
              subject="fix(workers): stop checkpoint writes after authority closes"
              detail="Preserve current Git input admission and cleanup while fencing deferred checkpoint publication."
              ;;
            provider-process-authority)
              subject="test(workers): prove provider lifetime with real host owners and local process I/O"
              detail="Exercise actual returned closures and service stop with explicit synthetic CLI boundaries."
              ;;
            provider-full)
              subject="fix(workers): reject provider work after invocation closes"
              detail="Bind provider work to live invocation authority while preserving independent cleanup."
              ;;
            transport-full)
              subject="fix(workers): reject stale workspace transfer operations"
              detail="Carry caller authority through initialization and transfer; preserve established custody."
              ;;
            *) exit 2 ;;
          esac
          printf '%s\n\n%s\n\n' "$subject" "$detail" > "$RUNNER_TEMP/commit-message.txt"
          cat >> "$RUNNER_TEMP/commit-message.txt" <<'MESSAGE'
          Co-authored-by: sallyom <11166065+sallyom@users.noreply.github.com>
          Co-authored-by: vincentkoc <25068+vincentkoc@users.noreply.github.com>
          MESSAGE
          git -c core.hooksPath=git-hooks -c user.name=roboclaw-bot -c user.email=309084314+roboclaw-bot@users.noreply.github.com commit --file "$RUNNER_TEMP/commit-message.txt"
          git log -1 --format="%H%n%P%n%T%n%B"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git diff --quiet HEAD
          git log -1 --format="%H%n%T%n%B"
      - name: Native rebase commit
        id: commit
        if: inputs.suite == 'provider-rebase-focused'
        run: bash "$RUNNER_TEMP/validate-candidate.sh" commit
      - name: Run the controller-owned validation recipe
        id: tests
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/validate-candidate.sh"
          git diff --quiet HEAD
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
      - name: Export verified commit without repository write credentials
        if: inputs.suite != 'provider-rebase-focused'
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/candidate.bundle" "$BASE_SHA..HEAD"
          git bundle verify "$RUNNER_TEMP/candidate.bundle"
          sdk_report_sha=""
          if [[ "$SUITE" == identity-sdk || "$SUITE" == identity-api || "$SUITE" == provider-resume-api || "$SUITE" == provider-sdk-repair ]]; then
            sdk_report_sha="$(sha256sum "$RUNNER_TEMP/candidate-sdk-api.json" | cut -d " " -f1)"
          fi
          jq -n --arg commit "$(git rev-parse HEAD)" --arg parent "$BASE_SHA" --arg tree "$EXPECTED_TREE" --arg patch "$PATCH_SHA256" --arg suite "$SUITE" --arg sdkReportSha "$sdk_report_sha" '{commit:$commit,parent:$parent,tree:$tree,patchSha256:$patch,suite:$suite,compatibilityReview:(if ($suite == "identity-sdk" or $suite == "identity-api" or $suite == "provider-resume-api" or $suite == "provider-sdk-repair") then {status:"required",reportSha256:$sdkReportSha} else null end)}' > "$RUNNER_TEMP/candidate.json"
          cat "$RUNNER_TEMP/candidate.json"
      - name: Native rebase export
        id: export
        if: inputs.suite == 'provider-rebase-focused'
        run: bash "$RUNNER_TEMP/validate-candidate.sh" export
      - name: Upload the verified commit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-candidate
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate.bundle
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate-sdk-api.json
            ${{ runner.temp }}/candidate-sdk-api.txt
      - name: Preserve native rebase evidence on every outcome
        if: always() && inputs.suite == 'provider-rebase-focused'
        env:
          REBASE_STEP_OUTCOMES: ${{ toJSON(steps) }}
          REBASE_JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          set -u
          evidence="$RUNNER_TEMP/pr159178-rebase"
          mkdir -p "$evidence/always"
          printf '%s\n' "$REBASE_STEP_OUTCOMES" > "$evidence/step-outcomes.json"
          jq -n --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg controller "$GITHUB_SHA" --arg status "$REBASE_JOB_STATUS" '{runId:$run,attempt:$attempt,controller:$controller,status:$status}' > "$evidence/run.json"
          git rev-parse HEAD > "$evidence/always/HEAD.txt" 2>&1
          git status --porcelain=v1 --untracked-files=no > "$evidence/always/tracked-status.txt" 2>&1
          git diff --binary HEAD > "$evidence/always/tracked-diff.patch" 2>&1
          git ls-files --stage > "$evidence/always/index-entries.txt" 2>&1
          if git cat-file -e "$EXPECTED_TREE^{tree}" 2>/dev/null; then
            git diff --binary "$EXPECTED_TREE" > "$evidence/always/expected-tree-diff.patch" 2>&1
          fi
          git ls-files --unmerged > "$evidence/always/unmerged-stages.txt" 2>&1
          for state in REBASE_HEAD ORIG_HEAD MERGE_HEAD CHERRY_PICK_HEAD AUTO_MERGE rebase-merge rebase-apply sequencer; do
            source="$(git rev-parse --git-path "$state")"
            if [[ -e "$source" ]]; then cp -R -- "$source" "$evidence/always/$state"; fi
          done
          if [[ -f "$RUNNER_TEMP/rebase-payload.json" ]]; then
            jq -r '.sourceChecks[] | "\(.sha256)  \(.path)"' "$RUNNER_TEMP/rebase-payload.json" > "$evidence/always/source-checks.sha256"
            sha256sum --check "$evidence/always/source-checks.sha256" > "$evidence/always/source-checks.result.txt" 2>&1
            printf '%s\n' "$?" > "$evidence/always/source-checks.exit.txt"
          fi
      - name: Upload native rebase evidence on every outcome
        if: always() && inputs.suite == 'provider-rebase-focused'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr159178-rebase-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/pr159178-rebase
