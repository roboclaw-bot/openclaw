name: PR 196867 secretless proof
on:
  push:
    branches: [roboclaw/proof-pr196867]
permissions:
  contents: read
concurrency:
  group: pr196867-secretless-proof
  cancel-in-progress: false
jobs:
  focused-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      OPENCLAW_NO_RESPAWN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@12.15.0 --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Regenerate artifacts and format changed source
        run: |
          mkdir -p .openclaw/tmp/pr196867-proof
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git d54e624149cf98ca96972d7a46815db87fcf4288
          pnpm config:docs:gen
          pnpm protocol:gen
          pnpm ui:i18n:baseline
          git diff --name-only d54e624149cf98ca96972d7a46815db87fcf4288 -- "*.ts" "*.tsx" "*.md" | xargs -r pnpm exec oxfmt --write
      - name: Owning store and attribution tests
        run: |
          node scripts/run-vitest.mjs src/agents/git-coauthor-attribution.test.ts src/agents/git-coauthor-prompt.test.ts src/state/user-preferences.git-coauthor.test.ts src/state/user-preferences.test.ts src/state/user-profiles-multi-account.test.ts --maxWorkers=1 2>&1 | tee .openclaw/tmp/pr196867-proof/state-tests.log
      - name: Proxy admission and publication tests
        if: always()
        run: |
          node scripts/run-vitest.mjs src/gateway/trusted-proxy-git-coauthor.test.ts src/gateway/trusted-proxy-git-coauthor.admission.test.ts src/gateway/server-methods/users-preferences.test.ts src/gateway/server-methods/users-enumeration.worker.test.ts src/gateway/github-publication-attribution.test.ts --maxWorkers=1 2>&1 | tee .openclaw/tmp/pr196867-proof/gateway-tests.log
      - name: Profile UI tests
        if: always()
        run: |
          pnpm --dir ui test src/pages/profile/profile-page-coauthor.test.tsx src/pages/profile/profile-page-preferences.test.tsx src/pages/profile/profile-page.readiness.test.tsx --maxWorkers=1 2>&1 | tee .openclaw/tmp/pr196867-proof/ui-tests.log
      - name: Verify generated config and test budget
        if: always()
        run: |
          pnpm config:docs:check
          pnpm check:test-lines-ratchet --base d54e624149cf98ca96972d7a46815db87fcf4288
          git diff --check
      - name: Preserve generated patch and evidence
        if: always()
        run: |
          mkdir -p .openclaw/tmp/pr196867-proof
          git diff --binary > .openclaw/tmp/pr196867-proof/generated.patch
          git status --short > .openclaw/tmp/pr196867-proof/generated-status.txt
          git rev-parse HEAD > .openclaw/tmp/pr196867-proof/head.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr196867-secretless-proof
          path: .openclaw/tmp/pr196867-proof/
          include-hidden-files: true
          retention-days: 3
