name: Symlinked config recovery qualification
run-name: O 188560 d620e452 installed config recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: o-symlink-188560-d620e452
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout task-owned proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          sparse-checkout: .proof/o-symlink-188560
          persist-credentials: false
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: d620e452247d70976c97b0c66532c33820be54b8
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Setup supported Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Run secretless exact-head qualification
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          proof_root="$(mktemp -d /tmp/o-symlink-ci.XXXXXX)"
          chmod 700 "$proof_root"
          mkdir -m700 "$proof_root/home" "$proof_root/tmp" "$proof_root/corepack" "$proof_root/evidence"
          echo "evidence=$proof_root/evidence" >> "$GITHUB_OUTPUT"
          env -i PATH="$PATH" HOME="$proof_root/home" TMPDIR="$proof_root/tmp" CI=1 \
            COREPACK_HOME="$proof_root/corepack" COREPACK_ENABLE_DOWNLOAD_PROMPT=0 COREPACK_ENV_FILE=0 \
            NPM_CONFIG_USERCONFIG=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /bin/bash "$GITHUB_WORKSPACE/harness/.proof/o-symlink-188560/run.sh" \
            "$GITHUB_WORKSPACE/candidate" d620e452247d70976c97b0c66532c33820be54b8 "$proof_root"
      - name: Upload task-owned synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: o-symlink-188560-d620e452
          path: ${{ steps.proof.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14
