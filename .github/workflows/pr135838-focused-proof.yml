name: PR 135838 focused proof
run-name: proof ${{ inputs.suite }} ${{ inputs.target_sha }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact task-fork commit to test
        required: true
        type: string
      suite:
        description: Narrow regression suite
        required: true
        type: choice
        options:
          [checkpoint, agent-input, identity, provider-behavior, transport-behavior, transport-full]
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'roboclaw-bot/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate immutable target
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Verify checked-out source
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git rev-parse HEAD HEAD^{tree}
      - name: Install declared toolchain and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "restore"
      - name: Run selected regression suite
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            checkpoint)
              pnpm test src/gateway/worker-environments/session-repository-checkpoints.test.ts src/gateway/worker-environments/workspace-result-ref-mutation.test.ts src/gateway/worker-environments/workspace-result-staging.concurrent.test.ts src/gateway/worker-environments/workspace-result-staging.reads.test.ts
              ;;
            agent-input)
              pnpm test src/gateway/agent-turn/agent-run-user-turn.test.ts src/gateway/server-methods/agent.test.ts src/gateway/server-methods/agent-run-local-operator-authority.test.ts src/gateway/agent-turn/internal-facade.test.ts
              ;;
            identity)
              pnpm test src/gateway/worker-environments/bootstrap.test.ts src/gateway/worker-environments/identity.test.ts src/gateway/worker-environments/provider-ssh-identity.test.ts src/gateway/worker-environments/ssh.test.ts src/gateway/worker-environments/tunnel.test.ts src/gateway/worker-environments/provider-bootstrap.test.ts src/gateway/worker-environments/desktop-tunnel.test.ts
              ;;
            provider-behavior)
              pnpm test extensions/crabbox/src/crabbox-worker-invocation-baseline.test.ts
              ;;
            transport-behavior)
              pnpm test src/gateway/worker-environments/transport-source-authority.test.ts
              ;;
            transport-full)
              test "$(git rev-parse HEAD^{tree})" = ef638f38f6129565d39a43f353f0ebb5201a8424
              test ! -e src/gateway/worker-environments/transport-source-authority.test.ts
              git fetch --no-tags --depth=1 origin 05d79a1c2e84632131776b7a44bf1d9d1ed43714
              pnpm test src/gateway/worker-environments/node-worker-repository-authority.test.ts src/gateway/worker-environments/node-worker-tunnel-authority.test.ts src/gateway/worker-environments/node-worker-workspace-actions.test.ts src/gateway/worker-environments/node-worker-workspace-fallback.test.ts src/gateway/worker-environments/node-worker-workspace-publication.test.ts src/gateway/worker-environments/node-worker-tunnel.test.ts src/gateway/worker-environments/environment-access.test.ts src/gateway/worker-environments/ssh.test.ts src/gateway/worker-environments/tunnel.test.ts src/gateway/worker-environments/workspace-sync-tunnel.test.ts src/gateway/worker-environments/repository-workspace-startup.test.ts src/gateway/worker-environments/node-workspace-transfer-command.test.ts src/gateway/worker-environments/node-workspace-transfer-service.test.ts src/gateway/worker-environments/node-workspace-transfer-pack.test.ts src/gateway/worker-environments/node-workspace-transfer-retention.test.ts src/gateway/worker-environments/node-workspace-transfer-revocation.test.ts src/gateway/worker-environments/node-workspace-transfer-encoding.test.ts src/gateway/worker-environments/node-workspace-transfer-credential.test.ts
              pnpm tsgo:core
              node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["src/gateway/worker-environments/environment-access.test.ts","src/gateway/worker-environments/environment-access.ts","src/gateway/worker-environments/node-worker-repository-authority.test.ts","src/gateway/worker-environments/node-worker-repository-preparation.ts","src/gateway/worker-environments/node-worker-tunnel-authority.test.ts","src/gateway/worker-environments/node-worker-tunnel.ts","src/gateway/worker-environments/node-worker-workspace-actions.test.ts","src/gateway/worker-environments/node-worker-workspace-actions.ts","src/gateway/worker-environments/node-worker-workspace-fallback.test.ts","src/gateway/worker-environments/node-worker-workspace-fallback.ts","src/gateway/worker-environments/node-workspace-transfer-command.test.ts","src/gateway/worker-environments/node-workspace-transfer-command.ts","src/gateway/worker-environments/node-workspace-transfer-encoding.test.ts","src/gateway/worker-environments/node-workspace-transfer-owner.ts","src/gateway/worker-environments/node-workspace-transfer-retention.test.ts","src/gateway/worker-environments/node-workspace-transfer-service.test.ts","src/gateway/worker-environments/node-workspace-transfer-service.ts","src/gateway/worker-environments/placement-dispatch-startup.ts","src/gateway/worker-environments/repository-workspace-startup.ts","src/gateway/worker-environments/session-workspace.ts","src/gateway/worker-environments/tunnel-contract.ts","src/gateway/worker-environments/tunnel.test.ts","src/gateway/worker-environments/tunnel.ts","src/gateway/worker-environments/workspace-sync-transport.ts","src/gateway/worker-environments/workspace-sync-tunnel.test.ts","src/gateway/worker-environments/workspace-sync.ts"]'
              pnpm check:line-cap-ratchet --base 05d79a1c2e84632131776b7a44bf1d9d1ed43714
              pnpm check:max-lines-ratchet --base 05d79a1c2e84632131776b7a44bf1d9d1ed43714
              ./node_modules/.bin/oxfmt --check src/gateway/worker-environments/environment-access.test.ts src/gateway/worker-environments/environment-access.ts src/gateway/worker-environments/node-worker-repository-authority.test.ts src/gateway/worker-environments/node-worker-repository-preparation.ts src/gateway/worker-environments/node-worker-tunnel-authority.test.ts src/gateway/worker-environments/node-worker-tunnel.ts src/gateway/worker-environments/node-worker-workspace-actions.test.ts src/gateway/worker-environments/node-worker-workspace-actions.ts src/gateway/worker-environments/node-worker-workspace-fallback.test.ts src/gateway/worker-environments/node-worker-workspace-fallback.ts src/gateway/worker-environments/node-workspace-transfer-command.test.ts src/gateway/worker-environments/node-workspace-transfer-command.ts src/gateway/worker-environments/node-workspace-transfer-encoding.test.ts src/gateway/worker-environments/node-workspace-transfer-owner.ts src/gateway/worker-environments/node-workspace-transfer-retention.test.ts src/gateway/worker-environments/node-workspace-transfer-service.test.ts src/gateway/worker-environments/node-workspace-transfer-service.ts src/gateway/worker-environments/placement-dispatch-startup.ts src/gateway/worker-environments/repository-workspace-startup.ts src/gateway/worker-environments/session-workspace.ts src/gateway/worker-environments/tunnel-contract.ts src/gateway/worker-environments/tunnel.test.ts src/gateway/worker-environments/tunnel.ts src/gateway/worker-environments/workspace-sync-transport.ts src/gateway/worker-environments/workspace-sync-tunnel.test.ts src/gateway/worker-environments/workspace-sync.ts
              git diff --check 05d79a1c2e84632131776b7a44bf1d9d1ed43714 HEAD
              ;;
            *) exit 2 ;;
          esac
