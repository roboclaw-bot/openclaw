              git diff --check 05d79a1c2e84632131776b7a44bf1d9d1ed43714 HEAD
              ;;
            identity-full)
              test "$(git rev-parse HEAD^{tree})" = 2596b275131e915f42b57e06d3c0132db37825c2
              pnpm test src/gateway/worker-environments/bootstrap.test.ts src/gateway/worker-environments/identity.test.ts src/gateway/worker-environments/provider-ssh-identity.test.ts src/gateway/worker-environments/ssh.test.ts src/gateway/worker-environments/tunnel.test.ts src/gateway/worker-environments/provider-bootstrap.test.ts src/gateway/worker-environments/desktop-tunnel.test.ts
              git fetch --no-tags --depth=1 origin 3e8b396a7dc833185c0fdba33efadef6826eeda7
              pnpm check:line-cap-ratchet --base 3e8b396a7dc833185c0fdba33efadef6826eeda7
              pnpm check:max-lines-ratchet --base 3e8b396a7dc833185c0fdba33efadef6826eeda7
              pnpm tsgo:core
              node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["docs/plugins/sdk-overview/capabilities.md","src/gateway/server-worker-environment-startup.ts","src/gateway/worker-environments/bootstrap-command.ts","src/gateway/worker-environments/bootstrap.test.ts","src/gateway/worker-environments/bootstrap.ts","src/gateway/worker-environments/identity.test.ts","src/gateway/worker-environments/identity.ts","src/gateway/worker-environments/provider-bootstrap.test.ts","src/gateway/worker-environments/provider-lifecycle.ts","src/gateway/worker-environments/provider-lifecycle.types.ts","src/gateway/worker-environments/provider-ssh-identity.test.ts","src/gateway/worker-environments/provider-ssh-identity.ts","src/gateway/worker-environments/service.ts","src/gateway/worker-environments/ssh.test.ts","src/gateway/worker-environments/ssh.ts","src/gateway/worker-environments/tunnel.test.ts","src/gateway/worker-environments/tunnel.ts","src/plugins/capability-provider.types.ts"]'
